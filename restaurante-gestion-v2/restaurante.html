<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabores del Altiplano · Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF8F3;--card:#fff;--ink:#241f21;--mut:#6b6560;--line:#e7e0d6;--pri:#A61E5B;--teal:#0F6B6F;--gold:#E0A526;--bad:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141a;--card:#221e26;--ink:#f1ece6;--mut:#a79fa0;--line:#38323c;--pri:#E0558F;--teal:#4fb5b8;--bad:#ef7a6e}}
:root[data-theme="dark"]{--bg:#17141a;--card:#221e26;--ink:#f1ece6;--mut:#a79fa0;--line:#38323c;--pri:#E0558F;--teal:#4fb5b8;--bad:#ef7a6e}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif}
header{padding:16px 16px 0;max-width:1000px;margin:auto}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,sans-serif;margin:0}
h1{font-size:26px;font-weight:800}
.band{height:6px;margin:10px 0 0;background:repeating-linear-gradient(90deg,var(--pri) 0 24px,var(--gold) 24px 36px,var(--teal) 36px 60px,var(--gold) 60px 72px)}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 16px;max-width:1000px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:0;background:none;color:var(--mut);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--pri);color:#fff}
main{max-width:1000px;margin:auto;padding:8px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font:800 22px "Bricolage Grotesque",sans-serif}.stat span{color:var(--mut);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600}
button.pri,button.ghost,button.sm{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--pri)}
button.pri{background:var(--pri);color:#fff}button.ghost,button.sm{background:none;color:var(--pri)}button.sm{padding:3px 10px;font-size:13px}button.del{color:var(--bad);border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:#d9f0ea;color:#0b5a4a}.low{background:#fde3df;color:var(--bad)}
.in{color:var(--teal);font-weight:600}.out{color:var(--bad);font-weight:600}.mut{color:var(--mut)}
.plato{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.step{display:flex;align-items:center;gap:8px}.step button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:18px}
dialog::backdrop{background:#0008}label{display:block;margin:10px 0;font-weight:600;font-size:13px}
input,select{width:100%;padding:9px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
#toast.show{opacity:1}
@media print{nav,header .band,.bar button,#toast{display:none}}
</style></head><body>
<header><h1>🍲 Sabores del Altiplano</h1><div class="mut">Sistema de gestión del restaurante</div><div class="band"></div></header>
<nav id="nav"></nav><main id="app"></main><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Bs=n=>'Bs '+(+n).toFixed(2),today=()=>new Date().toLocaleDateString('es-BO'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const seed=()=>({ing:[
{id:'i1',n:'Charque',u:'kg',s:8,m:3,c:70},{id:'i2',n:'Papa',u:'kg',s:40,m:15,c:5},{id:'i3',n:'Maíz mote',u:'kg',s:12,m:5,c:12},
{id:'i4',n:'Carne de res',u:'kg',s:20,m:8,c:55},{id:'i5',n:'Pollo',u:'kg',s:15,m:6,c:22},{id:'i6',n:'Arroz',u:'kg',s:25,m:10,c:9},
{id:'i7',n:'Ají amarillo',u:'kg',s:2,m:2,c:30},{id:'i8',n:'Maní',u:'kg',s:6,m:3,c:25}],
prov:[{id:'p1',n:'Mercado Rodríguez',t:'70012345'},{id:'p2',n:'Avícola Los Andes',t:'71122334'}],
plat:[{id:'d1',n:'Pique macho',p:55,r:[['i4',.3],['i2',.3],['i7',.02]]},{id:'d2',n:'Sopa de maní',p:30,r:[['i8',.08],['i2',.2],['i6',.05]]},
{id:'d3',n:'Silpancho',p:35,r:[['i4',.2],['i2',.3],['i6',.15]]},{id:'d4',n:'Fricasé',p:40,r:[['i5',.3],['i3',.1],['i7',.03]]},
{id:'d5',n:'Charquekan',p:50,r:[['i1',.2],['i3',.15],['i2',.2]]}],ped:[],comp:[],mov:[],fin:[]});
let S;try{S=JSON.parse(localStorage.getItem('rest1'))}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem('rest1',JSON.stringify(S))}catch(e){}};
let cur='dash',cart={};
const T={dash:'Inicio',ing:'Ingredientes',plat:'Platos',prov:'Proveedores',ped:'Pedidos',comp:'Compras',fin:'Ingresos y egresos',rep:'Reportes'};
const I=id=>S.ing.find(x=>x.id==id),low=()=>S.ing.filter(x=>x.s<=x.m);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function ask(title,fields,cb){const D=$('#dlg');
D.innerHTML=`<form><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t=='number'?'step="any" min="0"':''} ${f.r===0?'':'required'}>`}</label>`).join('')}<div class="row"><button type="button" class="ghost" id="cx">Cancelar</button><button class="pri">Guardar</button></div></form>`;
D.showModal();$('#cx').onclick=()=>D.close();D.querySelector('form').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));D.close();cb(o)}}
function move(iid,tipo,q,nota){const x=I(iid);if(tipo=='Entrada')x.s+=q;else if(tipo=='Salida')x.s=Math.max(0,x.s-q);else{q=q-x.s;x.s+=q}
S.mov.unshift({f:today(),i:x.n,t:tipo,q:+q.toFixed(2),nota});}
function addFin(t,d,m){S.fin.unshift({f:today(),t,d,m:+m})}
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')||`<tr><td colspan="${h.length}" class="mut">Aún no hay registros.</td></tr>`}</table></div>`;
const sum=t=>S.fin.filter(x=>x.t==t).reduce((a,x)=>a+x.m,0);
const V={
dash(){const L=low();return `<div class="grid"><div class="stat"><b class="in">${Bs(sum('Ingreso'))}</b><span>Ingresos</span></div><div class="stat"><b class="out">${Bs(sum('Egreso'))}</b><span>Egresos</span></div><div class="stat"><b>${Bs(sum('Ingreso')-sum('Egreso'))}</b><span>Balance</span></div><div class="stat"><b>${L.length}</b><span>Alertas de stock</span></div></div>
<div class="box"><h3>Ingredientes por reponer</h3>${L.length?tbl(['Ingrediente','Stock','Mínimo'],L.map(x=>`<tr><td>${esc(x.n)}</td><td class="out">${x.s} ${x.u}</td><td>${x.m} ${x.u}</td></tr>`)):'<p class="mut">Todo el inventario está sobre el mínimo.</p>'}</div>
<div class="box"><h3>Últimos pedidos</h3>${tbl(['N°','Mesa','Total','Fecha'],S.ped.slice(0,5).map(p=>`<tr><td>${p.n}</td><td>${esc(p.mesa)}</td><td>${Bs(p.tot)}</td><td>${p.f}</td></tr>`))}</div>`},
ing(){return `<div class="bar"><h2>Ingredientes</h2><button class="pri" data-a="addIng">Nuevo ingrediente</button></div><div class="box">${tbl(['Nombre','Stock','Mínimo','Costo/u','Estado',''],S.ing.map(x=>`<tr><td>${esc(x.n)}</td><td>${+x.s.toFixed(2)} ${x.u}</td><td>${x.m} ${x.u}</td><td>${Bs(x.c)}</td><td><span class="tag ${x.s<=x.m?'low':'ok'}">${x.s<=x.m?'Reponer':'Normal'}</span></td><td><button class="sm" data-a="mov" data-id="${x.id}">Movimiento</button> <button class="sm del" data-a="del" data-k="ing" data-id="${x.id}">Borrar</button></td></tr>`))}</div>
<div class="box"><h3>Historial de movimientos</h3>${tbl(['Fecha','Ingrediente','Tipo','Cantidad','Nota'],S.mov.slice(0,15).map(m=>`<tr><td>${m.f}</td><td>${esc(m.i)}</td><td>${m.t}</td><td>${m.q}</td><td>${esc(m.nota||'')}</td></tr>`))}</div>`},
plat(){return `<div class="bar"><h2>Platos</h2><button class="pri" data-a="addPlat">Nuevo plato</button></div><div class="box">${S.plat.map(p=>`<div class="plato"><div><b>${esc(p.n)}</b> · ${Bs(p.p)}<div class="mut" style="font-size:13px">${p.r.map(([i,q])=>`${q} ${I(i)?.u||''} ${esc(I(i)?.n||'?')}`).join(', ')}</div></div><button class="sm del" data-a="del" data-k="plat" data-id="${p.id}">Borrar</button></div>`).join('')||'<p class="mut">Agrega tu primer plato.</p>'}</div>`},
prov(){return `<div class="bar"><h2>Proveedores</h2><button class="pri" data-a="addProv">Nuevo proveedor</button></div><div class="box">${tbl(['Nombre','Teléfono',''],S.prov.map(p=>`<tr><td>${esc(p.n)}</td><td>${esc(p.t)}</td><td><button class="sm del" data-a="del" data-k="prov" data-id="${p.id}">Borrar</button></td></tr>`))}</div>`},
ped(){const tot=S.plat.reduce((a,p)=>a+(cart[p.id]||0)*p.p,0);return `<h2>Nuevo pedido</h2><div class="box">${S.plat.map(p=>`<div class="plato"><div><b>${esc(p.n)}</b><div class="mut">${Bs(p.p)}</div></div><div class="step"><button data-a="step" data-id="${p.id}" data-d="-1" aria-label="Quitar">−</button><b>${cart[p.id]||0}</b><button data-a="step" data-id="${p.id}" data-d="1" aria-label="Agregar">+</button></div></div>`).join('')}
<label>Mesa o cliente<input id="mesa" placeholder="Ej: Mesa 4"></label><div class="bar"><b>Total: ${Bs(tot)}</b><button class="pri" data-a="order">Registrar pedido</button></div></div>
<div class="box"><h3>Historial de ventas</h3>${tbl(['N°','Mesa','Detalle','Total','Fecha'],S.ped.map(p=>`<tr><td>${p.n}</td><td>${esc(p.mesa)}</td><td>${esc(p.d)}</td><td>${Bs(p.tot)}</td><td>${p.f}</td></tr>`))}</div>`},
comp(){return `<div class="bar"><h2>Compras de insumos</h2><button class="pri" data-a="addComp">Registrar compra</button></div><div class="box">${tbl(['Fecha','Proveedor','Ingrediente','Cantidad','Costo'],S.comp.map(c=>`<tr><td>${c.f}</td><td>${esc(c.p)}</td><td>${esc(c.i)}</td><td>${c.q}</td><td>${Bs(c.c)}</td></tr>`))}</div>`},
fin(){return `<div class="bar"><h2>Ingresos y egresos</h2><button class="pri" data-a="addFin">Nuevo registro</button></div><div class="grid"><div class="stat"><b class="in">${Bs(sum('Ingreso'))}</b><span>Ingresos</span></div><div class="stat"><b class="out">${Bs(sum('Egreso'))}</b><span>Egresos</span></div></div><div class="box">${tbl(['Fecha','Tipo','Descripción','Monto'],S.fin.map(f=>`<tr><td>${f.f}</td><td class="${f.t=='Ingreso'?'in':'out'}">${f.t}</td><td>${esc(f.d)}</td><td>${Bs(f.m)}</td></tr>`))}</div>`},
rep(){const v={};S.ped.forEach(p=>p.items.forEach(([n,q,m])=>{v[n]=v[n]||[0,0];v[n][0]+=q;v[n][1]+=m}));
return `<div class="bar"><h2>Reportes</h2><button class="ghost" data-a="print">Imprimir / PDF</button></div>
<div class="box"><h3>Inventario valorizado</h3>${tbl(['Ingrediente','Stock','Valor'],S.ing.map(x=>`<tr><td>${esc(x.n)}</td><td>${+x.s.toFixed(2)} ${x.u}</td><td>${Bs(x.s*x.c)}</td></tr>`))}<p><b>Total: ${Bs(S.ing.reduce((a,x)=>a+x.s*x.c,0))}</b></p></div>
<div class="box"><h3>Ventas por plato</h3>${tbl(['Plato','Unidades','Total'],Object.entries(v).map(([n,a])=>`<tr><td>${esc(n)}</td><td>${a[0]}</td><td>${Bs(a[1])}</td></tr>`))}</div>
<div class="box"><h3>Resumen</h3><p>Ventas: ${Bs(S.ped.reduce((a,p)=>a+p.tot,0))} · Compras: ${Bs(S.comp.reduce((a,c)=>a+c.c,0))} · Balance: <b>${Bs(sum('Ingreso')-sum('Egreso'))}</b></p><button class="ghost del" data-a="reset">Restablecer datos de ejemplo</button></div>`}};
function render(){$('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button data-v="${k}" class="${k==cur?'on':''}">${v}${k=='dash'&&low().length?' ('+low().length+')':''}</button>`).join('');$('#app').innerHTML=V[cur]();save()}
const opts=a=>a.map(x=>[x.id,x.n]);
const A={
addIng:()=>ask('Nuevo ingrediente',[{k:'n',l:'Nombre'},{k:'u',l:'Unidad (kg, l, unid)'},{k:'s',l:'Stock inicial',t:'number'},{k:'m',l:'Stock mínimo',t:'number'},{k:'c',l:'Costo por unidad (Bs)',t:'number'}],o=>{S.ing.push({id:uid(),n:o.n,u:o.u,s:+o.s,m:+o.m,c:+o.c});render()}),
mov:b=>ask('Movimiento de '+I(b.dataset.id).n,[{k:'t',l:'Tipo',t:'select',o:[['Entrada','Entrada'],['Salida','Salida (merma o consumo)'],['Ajuste','Ajuste (stock real contado)']]},{k:'q',l:'Cantidad',t:'number'},{k:'n',l:'Nota',r:0}],o=>{move(b.dataset.id,o.t,+o.q,o.n);render();toast('Movimiento registrado')}),
addPlat:()=>{const io=[['','—']].concat(opts(S.ing));ask('Nuevo plato',[{k:'n',l:'Nombre'},{k:'p',l:'Precio (Bs)',t:'number'}].concat([1,2,3].flatMap(n=>[{k:'i'+n,l:'Ingrediente '+n,t:'select',o:io,r:0},{k:'q'+n,l:'Cantidad por plato',t:'number',r:0}])),o=>{const r=[1,2,3].filter(n=>o['i'+n]&&+o['q'+n]>0).map(n=>[o['i'+n],+o['q'+n]]);S.plat.push({id:uid(),n:o.n,p:+o.p,r});render()})},
addProv:()=>ask('Nuevo proveedor',[{k:'n',l:'Nombre'},{k:'t',l:'Teléfono'}],o=>{S.prov.push({id:uid(),n:o.n,t:o.t});render()}),
addComp:()=>{if(!S.prov.length)return toast('Primero registra un proveedor');ask('Registrar compra',[{k:'p',l:'Proveedor',t:'select',o:opts(S.prov)},{k:'i',l:'Ingrediente',t:'select',o:opts(S.ing)},{k:'q',l:'Cantidad',t:'number'},{k:'c',l:'Costo total (Bs)',t:'number'}],o=>{const x=I(o.i),p=S.prov.find(y=>y.id==o.p);move(o.i,'Entrada',+o.q,'Compra a '+p.n);x.c=+o.c/+o.q;S.comp.unshift({f:today(),p:p.n,i:x.n,q:+o.q,c:+o.c});addFin('Egreso','Compra: '+x.n,o.c);render();toast('Compra registrada y stock actualizado')})},
addFin:()=>ask('Nuevo registro',[{k:'t',l:'Tipo',t:'select',o:[['Ingreso','Ingreso'],['Egreso','Egreso']]},{k:'d',l:'Descripción'},{k:'m',l:'Monto (Bs)',t:'number'}],o=>{addFin(o.t,o.d,o.m);render()}),
del:b=>{if(confirm('¿Borrar este registro?')){S[b.dataset.k]=S[b.dataset.k].filter(x=>x.id!=b.dataset.id);render()}},
step:b=>{const k=b.dataset.id;cart[k]=Math.max(0,(cart[k]||0)+ +b.dataset.d);const m=$('#mesa')?.value;render();if($('#mesa'))$('#mesa').value=m},
order:()=>{const sel=S.plat.filter(p=>cart[p.id]>0);if(!sel.length)return toast('Agrega al menos un plato');const need={};
sel.forEach(p=>p.r.forEach(([i,q])=>need[i]=(need[i]||0)+q*cart[p.id]));
for(const i in need)if(!I(i)||I(i).s<need[i])return toast('Falta stock de '+(I(i)?.n||'ingrediente'));
const n=S.ped.length+1,tot=sel.reduce((a,p)=>a+p.p*cart[p.id],0);
for(const i in need)move(i,'Salida',need[i],'Pedido #'+n);
S.ped.unshift({n,mesa:$('#mesa').value||'Sin mesa',tot,f:today(),d:sel.map(p=>cart[p.id]+'× '+p.n).join(', '),items:sel.map(p=>[p.n,cart[p.id],p.p*cart[p.id]])});
addFin('Ingreso','Venta pedido #'+n,tot);cart={};render();toast('Pedido registrado. Stock descontado'+(low().length?' · hay alertas de stock':''))},
print:()=>window.print(),reset:()=>{if(confirm('Se borrarán todos tus datos.')){S=seed();cart={};render()}}};
document.addEventListener('click',e=>{const v=e.target.closest('[data-v]');if(v){cur=v.dataset.v;return render()}const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b)});
render();
</script></body></html>
